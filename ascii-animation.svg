<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 850 350" width="100%" height="350">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <style>
    .terminal-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 12px; }
    .header-bg { fill: url(#headerGrad); }
    .term-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 12.5px; fill: #8b949e; font-weight: 600; text-anchor: middle; }
    .code-text { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13.5px; fill: #c9d1d9; }
    .prompt { fill: #58a6ff; font-weight: bold; }
    .cmd { fill: #79c0ff; font-weight: 600; }
    .green { fill: #3fb950; font-weight: bold; }
    .yellow { fill: #e3b341; }
    .purple { fill: #d2a8ff; }
    .cyan { fill: #38bdf8; }
    .coral { fill: #ff7b72; font-weight: 600; }

    /* Blinking Terminal Cursor */
    .cursor {
      animation: blink 0.75s infinite;
      fill: #38bdf8;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* Razor Sharp ASCII Donut Animation */
    .ascii-donut {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 12.5px;
      line-height: 15px;
      white-space: pre;
      fill: #38bdf8;
      font-weight: 700;
      letter-spacing: 0.5px;
    }


    @keyframes df_0 {
      0%, 0.00% { opacity: 0; display: none; }
      0.00%, 9.99% { opacity: 1; display: inline; }
      10.00%, 100% { opacity: 0; display: none; }
    }
    .donut-f0 {
      animation: df_0 1.4s infinite;
    }
    
    @keyframes df_1 {
      0%, 9.99% { opacity: 0; display: none; }
      10.00%, 19.99% { opacity: 1; display: inline; }
      20.00%, 100% { opacity: 0; display: none; }
    }
    .donut-f1 {
      animation: df_1 1.4s infinite;
    }
    
    @keyframes df_2 {
      0%, 19.99% { opacity: 0; display: none; }
      20.00%, 29.99% { opacity: 1; display: inline; }
      30.00%, 100% { opacity: 0; display: none; }
    }
    .donut-f2 {
      animation: df_2 1.4s infinite;
    }
    
    @keyframes df_3 {
      0%, 29.99% { opacity: 0; display: none; }
      30.00%, 39.99% { opacity: 1; display: inline; }
      40.00%, 100% { opacity: 0; display: none; }
    }
    .donut-f3 {
      animation: df_3 1.4s infinite;
    }
    
    @keyframes df_4 {
      0%, 39.99% { opacity: 0; display: none; }
      40.00%, 49.99% { opacity: 1; display: inline; }
      50.00%, 100% { opacity: 0; display: none; }
    }
    .donut-f4 {
      animation: df_4 1.4s infinite;
    }
    
    @keyframes df_5 {
      0%, 49.99% { opacity: 0; display: none; }
      50.00%, 59.99% { opacity: 1; display: inline; }
      60.00%, 100% { opacity: 0; display: none; }
    }
    .donut-f5 {
      animation: df_5 1.4s infinite;
    }
    
    @keyframes df_6 {
      0%, 59.99% { opacity: 0; display: none; }
      60.00%, 69.99% { opacity: 1; display: inline; }
      70.00%, 100% { opacity: 0; display: none; }
    }
    .donut-f6 {
      animation: df_6 1.4s infinite;
    }
    
    @keyframes df_7 {
      0%, 69.99% { opacity: 0; display: none; }
      70.00%, 79.99% { opacity: 1; display: inline; }
      80.00%, 100% { opacity: 0; display: none; }
    }
    .donut-f7 {
      animation: df_7 1.4s infinite;
    }
    
    @keyframes df_8 {
      0%, 79.99% { opacity: 0; display: none; }
      80.00%, 89.99% { opacity: 1; display: inline; }
      90.00%, 100% { opacity: 0; display: none; }
    }
    .donut-f8 {
      animation: df_8 1.4s infinite;
    }
    
    @keyframes df_9 {
      0%, 89.99% { opacity: 0; display: none; }
      90.00%, 99.99% { opacity: 1; display: inline; }
      100.00%, 100% { opacity: 0; display: none; }
    }
    .donut-f9 {
      animation: df_9 1.4s infinite;
    }
    

    .pulse-glow {
      animation: pulse 2.5s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { opacity: 0.85; }
      100% { opacity: 1; }
    }
  </style>

