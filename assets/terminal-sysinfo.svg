<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 880 380" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#181e26"/>
      <stop offset="100%" stop-color="#12161d"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="glowGpu" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <style>
    .terminal-bg { fill: #0b0f14; stroke: #232a35; stroke-width: 1.5; rx: 10px; }
    .header-bar { fill: url(#termGrad); }
    .term-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 12.5px; fill: #94a3b8; font-weight: 600; text-anchor: middle; }
    .code-text { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13px; fill: #cbd5e1; }
    .prompt { fill: #38bdf8; font-weight: bold; }
    .cmd { fill: #f8fafc; font-weight: 600; }
    .green { fill: #34d399; font-weight: bold; }
    .yellow { fill: #fbbf24; }
    .purple { fill: #c084fc; }
    .cyan { fill: #38bdf8; }
    .coral { fill: #f87171; font-weight: 600; }
    .dim { fill: #64748b; }

    /* Blinking Terminal Cursor */
    .cursor {
      animation: blink 0.75s infinite;
      fill: #38bdf8;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* ASCII Avatar Matrix */
    .ascii-avatar {
      font-family: 'Consolas', 'Segoe UI Symbol', 'DejaVu Sans Mono', 'Courier New', monospace;
      font-size: 11.5px;
      line-height: 13.5px;
      white-space: pre;
      fill: url(#neonCyan);
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none !important; opacity: 1 !important; }
    }
  </style>

  <!-- Terminal Window Box -->
  <rect x="5" y="5" width="870" height="370" rx="10" class="terminal-bg"/>
  
  <!-- Window Header Bar -->
  <path d="M 5 15 Q 5 5 15 5 L 865 5 Q 875 5 875 15 L 875 36 L 5 36 Z" class="header-bar"/>
  <line x1="5" y1="36" x2="875" y2="36" stroke="#232a35" stroke-width="1"/>

  <!-- Window Buttons -->
  <circle cx="24" cy="21" r="5.5" fill="#f87171"/>
  <circle cx="42" cy="21" r="5.5" fill="#fbbf24"/>
  <circle cx="60" cy="21" r="5.5" fill="#34d399"/>

