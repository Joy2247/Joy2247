<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="100%">
  <defs>
    <linearGradient id="dividerFadeDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="15%" stop-color="#30363d" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="85%" stop-color="#30363d" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .mono {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    }
  </style>

  <!-- Main Baseline -->
  <line x1="20" y1="12" x2="880" y2="12" stroke="url(#dividerFadeDark)" stroke-width="1.5" />

  <!-- Tactical Reticle Ticks (Left & Right) -->
  <line x1="20" y1="8" x2="20" y2="16" stroke="#38bdf8" stroke-width="2" />
  <circle cx="20" cy="12" r="2" fill="#60a5fa" />
  
  <line x1="880" y1="8" x2="880" y2="16" stroke="#38bdf8" stroke-width="2" />
  <circle cx="880" cy="12" r="2" fill="#60a5fa" />

  <!-- Inner Reticle Bracket Markers -->
  <line x1="330" y1="8" x2="345" y2="8" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="330" y1="16" x2="345" y2="16" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="345" y1="8" x2="345" y2="16" stroke="#38bdf8" stroke-width="1.5" />

  <line x1="555" y1="8" x2="570" y2="8" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="555" y1="16" x2="570" y2="16" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="555" y1="8" x2="555" y2="16" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Center Tactical Node -->
  <polygon points="450,5 457,12 450,19 443,12" fill="#38bdf8" stroke="#2563eb" stroke-width="1" />
  <circle cx="450" cy="12" r="1.5" fill="#FFFFFF" />

  <!-- Left Micro Text -->
  <text class="mono" x="428" y="15" text-anchor="end" font-size="8.5" font-weight="700" fill="#8B949E" letter-spacing="1">JOY-01</text>

  <!-- Right Micro Text -->
  <text class="mono" x="472" y="15" text-anchor="start" font-size="8.5" font-weight="700" fill="#8B949E" letter-spacing="1">SYS.DIV</text>
</svg>
