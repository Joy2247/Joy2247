<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Shreyansh Patel — Software &amp; Systems Developer</title>
  <desc id="desc">An editorial technical nameplate in warm white and deep slate with circuit traces and a sculptural cyan-blue ribbon.</desc>
  <defs>
    <linearGradient id="ribbon" x1="823" y1="328" x2="1045" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1d4ed8"/>
      <stop offset="0.48" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="fold" x1="876" y1="76" x2="1000" y2="173" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="946" cy="201" r="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284c7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e2530"/>
    </pattern>
  </defs>

  <!-- Background Base & Micro Dot Grid -->
  <rect width="1200" height="420" rx="8" fill="#0c1015"/>
  <rect width="1200" height="420" rx="8" fill="url(#dotGrid)"/>
  <rect width="1200" height="420" rx="8" fill="none" stroke="#222834" stroke-width="1.5"/>

  <!-- Top Telemetry Bar -->
  <g font-family="'SFMono-Regular', Consolas, monospace" font-size="11" fill="#64748b" letter-spacing="1.5">
    <text x="62" y="36">HOST: JOY-SYS // ARCH: x86_64</text>
    <text x="600" y="36" text-anchor="middle">KERNEL: POSIX // GCC -O3</text>
    <text x="1138" y="36" text-anchor="end" fill="#38bdf8">STATUS: ONLINE [200 OK]</text>
  </g>
  <path d="M62 45h1076" stroke="#1e2530" stroke-width="1"/>

  <!-- Left Header Elements -->
  <path d="M60 76h30" stroke="#38bdf8" stroke-width="3"/>
  <text x="106" y="83" fill="#94a3b8" font-family="'SFMono-Regular', Consolas, monospace" font-size="18" letter-spacing="3">SHREYANSH PATEL</text>
  <text x="55" y="218" fill="#f8fafc" font-family="Georgia, 'Times New Roman', serif" font-size="118" font-style="italic" letter-spacing="-5">Shreyansh<tspan fill="#38bdf8">.</tspan></text>
  <text x="62" y="270" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="25" letter-spacing="0.2">Systems programming, automation &amp; full-stack software engineering.</text>

  <!-- Technical Circuit Traces -->
  <g fill="none" stroke="#1e293b" stroke-width="1.5">
    <path d="M62 295 h180 l25 25 h120"/>
    <circle cx="387" cy="320" r="3" fill="#38bdf8"/>
    <path d="M110 320 h80 l15 15 h90"/>
    <circle cx="295" cy="335" r="2.5" fill="#64748b"/>
  </g>

  <!-- Right Geometric / Architectural Wireframe -->
  <circle cx="946" cy="201" r="220" fill="url(#ambientGlow)"/>
  <g fill="none" stroke="#222b38" stroke-width="1.2">
    <circle cx="946" cy="201" r="145"/>
    <ellipse cx="946" cy="201" rx="195" ry="75" transform="rotate(-38 946 201)"/>
    <ellipse cx="946" cy="201" rx="170" ry="60" transform="rotate(45 946 201)"/>
    <!-- Reticle Ticks -->
    <path d="M1132 61v20m-10-10h20M756 318v20m-10-10h20"/>
    <circle cx="946" cy="201" r="3" fill="#38bdf8"/>
  </g>

  <!-- Sculptural Cyan-Blue Origami Ribbon -->
  <path d="M879 78h151l-92 78H787z" fill="url(#fold)"/>
  <path d="M1030 78 874 328H764L920 78z" fill="url(#ribbon)"/>
  <path d="M764 328h110l66-55H830z" fill="#1e3a8a"/>
  <path d="m920 79-155 248" fill="none" stroke="#93c5fd" stroke-opacity="0.75" stroke-width="1.5"/>

  <!-- Sub-label 01 & Lat/Long -->
  <text x="1082" y="318" fill="#94a3b8" font-family="'SFMono-Regular', Consolas, monospace" font-size="20">01</text>
  <text x="1082" y="336" fill="#64748b" font-family="'SFMono-Regular', Consolas, monospace" font-size="10" letter-spacing="1">18.52° N</text>

  <!-- Bottom Technical Grid -->
  <path d="M62 362h1076" stroke="#1e2530"/>
  <text x="62" y="394" fill="#94a3b8" font-family="'SFMono-Regular', Consolas, monospace" font-size="15" letter-spacing="2">SYSTEMS / ALGORITHMS / FULL-STACK</text>
  <text x="1138" y="394" text-anchor="end" fill="#94a3b8" font-family="'SFMono-Regular', Consolas, monospace" font-size="15" letter-spacing="2">PUNE, INDIA</text>
</svg>
