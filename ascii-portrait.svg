<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 850 490" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="cyanShimmer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <style>
    .terminal-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 12px; }
    .header-bg { fill: url(#headerGrad); }
    .term-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 12.5px; fill: #8b949e; font-weight: 600; text-anchor: middle; }
    .code-text { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 13.5px; fill: #c9d1d9; }
    .prompt { fill: #58a6ff; font-weight: bold; }
    .cmd { fill: #79c0ff; font-weight: 600; }
    .green { fill: #3fb950; font-weight: bold; }
    .yellow { fill: #e3b341; }
    .purple { fill: #d2a8ff; }
    .cyan { fill: #38bdf8; }
    .coral { fill: #ff7b72; font-weight: 600; }

    /* Blinking Terminal Cursor */
    .cursor {
      animation: blink 0.75s infinite;
      fill: #38bdf8;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* Razor Sharp ASCII Face */
    .ascii-face {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 12.5px;
      line-height: 15px;
      white-space: pre;
      fill: #38bdf8;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .shimmer-text {
      animation: shimmer 4s ease-in-out infinite alternate;
    }
    @keyframes shimmer {
      0% { fill: #38bdf8; }
      50% { fill: #58a6ff; }
      100% { fill: #79c0ff; }
    }

    /* Respect reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      .cursor, .shimmer-text { animation: none !important; }
    }
  </style>

